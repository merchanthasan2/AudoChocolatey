<body>
<div class="win">
  <div class="titlebar"><span>Quantum Updater</span><span>Park D · Cleanup</span></div>

      <div class="brand">Quantum Updater<small>Keeps your apps current</small></div>
      <div><div class="sec">Maintenance</div>
        <nav class="nav"><a class="on" href="06-cleanup.html">Cleanup</a></nav>

      <div><div class="sec">Software</div>
