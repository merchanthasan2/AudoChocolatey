name: CI Pipeline

on:
  push:
    branches: [ main, channel/windows ]
  pull_request:
    branches: [ main, channel/windows ]

permissions:
  contents: read

jobs:
  winui-build-and-test:
    name: DeskVerve WinUI Build & Test
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Zero-Emoji Policy Enforcement Check
        shell: pwsh
        run: |
          $emojiRegex = '[\uD800-\uDBFF][\uDC00-\uDFFF]|[\u2600-\u27BF]|[\u2300-\u23FF]|[\u2B50-\u2B55]'
          $files = Get-ChildItem -Path src -File -Recurse -Include *.cs, *.xaml | Where-Object { $_.FullName -notmatch '[\\/](bin|obj)[\\/]' }
          $violations = 0
          foreach ($file in $files) {
            $content = Get-Content -LiteralPath $file.FullName -Raw
            if ($content -match $emojiRegex) {
              Write-Error "Emoji violation found in $($file.FullName)"
              $violations++
            }
          }
          if ($violations -gt 0) {
            throw "Total emoji violations found: $violations. Zero-Emoji policy failed."
          }
          Write-Host "Zero-Emoji policy passed: 0 emoji violations detected in $($files.Count) source files."

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build DeskVerve WinUI App
        shell: pwsh
        run: |
          dotnet build src\QuantumUpdater\QuantumUpdater.csproj -c Release -r win-x64

      - name: Run Unit Tests
        shell: pwsh
        run: |
          dotnet test tests\QuantumUpdater.Tests -c Release -- -parallel none
