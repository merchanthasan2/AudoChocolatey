name: CI Pipeline

on:
  push:
    branches: [ main, channel/windows ]
  pull_request:
    branches: [ main, channel/windows ]

permissions:
  contents: read

jobs:
  web-and-lint:
    name: Web Frontend & Zero-Emoji Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate JavaScript Syntax
        run: |
          node -c web/app.js

      - name: Set up Python for Lint Checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Zero-Emoji Policy Enforcement Check
        run: |
          python -c "
          import re, sys
          emoji_pattern = re.compile(
              r'[\U00010000-\U0010ffff]|[\u2600-\u27bf]|[\u2300-\u2317\u2319-\u23ff]|[\u2b50-\u2b55]|[\u203c-\u2049]'
          )
          target_files = ['web/index.html', 'web/style.css', 'web/app.js']
          violations = 0
          for file_path in target_files:
              with open(file_path, 'r', encoding='utf-8') as f:
                  for i, line in enumerate(f, 1):
                      matches = emoji_pattern.findall(line)
                      if matches:
                          print(f'Emoji violation in {file_path}:{i}: {matches}')
                          violations += 1
          if violations > 0:
              print(f'Total emoji violations found: {violations}. Zero-Emoji policy failed.')
              sys.exit(1)
          print('Zero-Emoji policy passed: 0 emoji violations detected.')
          "

  winui-build-and-test:
    name: DeskVerve WinUI Build & Test
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build DeskVerve WinUI App
        shell: pwsh
        run: |
          dotnet build src\QuantumUpdater\QuantumUpdater.csproj -c Release -r win-x64

      - name: Run Unit Tests
        shell: pwsh
        run: |
          dotnet test tests\QuantumUpdater.Tests -c Release -- -parallel none
