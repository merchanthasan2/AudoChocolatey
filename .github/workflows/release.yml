name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v2.0.0)'
        required: false
        default: 'v2.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows app
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Resolve release tag
        id: meta
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag_name }}"
          } else {
            $tag = "${{ github.ref_name }}"
          }
          if (-not $tag) { $tag = "v2.0.0" }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Release tag: $tag"

      - name: Build Standalone PyInstaller Binary
        shell: pwsh
        run: |
          python build_exe.py QuantumUpdater
          New-Item -ItemType Directory -Force -Path py-artifacts | Out-Null
          # onedir needs the whole folder — a lone .exe bootloader will not start (Python DLL / _internal missing).
          $zip = "py-artifacts\QuantumUpdater-Windows.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "dist\QuantumUpdater\*" -DestinationPath $zip -Force
          # Keep a copy of the bootloader only for hashing notes; do not publish it alone as the install asset.
          Copy-Item -Path "dist\QuantumUpdater\QuantumUpdater.exe" -Destination "py-artifacts\QuantumUpdater.bootloader.exe"
          Get-Item $zip | Format-List FullName, Length

      - name: Prepare winget manifests
        shell: pwsh
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          $ver = $tag.TrimStart("v")
          # Point winget at the zip until a true single-file portable exists.
          .\tools\prepare_winget_release.ps1 -ExePath "py-artifacts\QuantumUpdater-Windows.zip" -Version $ver -AssetName "QuantumUpdater-Windows.zip"
          New-Item -ItemType Directory -Force -Path winget-artifacts | Out-Null
          Copy-Item -Path "manifests\w\QuantumStep\QuantumUpdater\$ver\*" -Destination "winget-artifacts\" -Force
          Get-ChildItem winget-artifacts | Format-Table Name, Length

      - name: Upload PyInstaller Binary to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Quantum Updater ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          body: |
            ## Install (another PC)
            1. Download **QuantumUpdater-Windows.zip**
            2. Unzip the whole folder (keep `_internal` next to the exe)
            3. Run `QuantumUpdater.exe` and approve UAC

            Do **not** download a lone bootloader `.exe` without `_internal` — that fails with Python errors.

            After winget community acceptance:
            ```
            winget install QuantumStep.QuantumUpdater
            ```
          files: |
            py-artifacts/QuantumUpdater-Windows.zip
            winget-artifacts/*
          fail_on_unmatched_files: true
