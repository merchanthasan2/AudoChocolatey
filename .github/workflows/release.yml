name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v2.0.0)'
        required: false
        default: 'v2.0.0'

permissions:
  contents: write

jobs:
  build-tauri:
    name: Build Tauri v2 Windows Installer & Binary
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2.0.0

      - name: Build Tauri Desktop Bundle
        working-directory: src-tauri
        run: |
          npx @tauri-apps/cli build

      - name: Collect Release Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts
          # Copy NSIS installer and standalone exe from target release bundle
          Get-ChildItem -Path src-tauri\target\release\bundle\nsis\*.exe | Copy-Item -Destination release-artifacts\
          if (Test-Path "src-tauri\target\release\quantum_updater.exe") {
            Copy-Item -Path "src-tauri\target\release\quantum_updater.exe" -Destination "release-artifacts\QuantumUpdater-Portable.exe"
          }

      - name: Upload Release Binaries to GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || inputs.tag_name }}
          files: release-artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true

  build-pyinstaller:
    name: Build Standalone Python Bundle
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Standalone PyInstaller Binary
        shell: pwsh
        run: |
          python build_exe.py
          New-Item -ItemType Directory -Force -Path py-artifacts
          if (Test-Path "dist\QuantumUpdater.exe") {
            Copy-Item -Path "dist\QuantumUpdater.exe" -Destination "py-artifacts\QuantumUpdater-PyWebview.exe"
          }

      - name: Upload PyInstaller Binary to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || inputs.tag_name }}
          files: py-artifacts/*
