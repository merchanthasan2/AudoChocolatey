name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v3.0.0)'
        required: false
        default: 'v3.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release DeskVerve (WinUI 3)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run Unit Tests
        shell: pwsh
        run: |
          dotnet test tests\QuantumUpdater.Tests -c Release -- -parallel none

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y

      - name: Resolve Release Tag
        id: meta
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:EVENT_NAME -eq "workflow_dispatch") {
            $tag = $env:INPUT_TAG
          } else {
            $tag = $env:REF_NAME
          }
          if (-not $tag) { $tag = "v3.0.0" }

          # Prevent script injection and enforce semver release tag pattern
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Invalid tag '$tag'. Tag must match pattern ^v\d+\.\d+\.\d+$"
          }

          $ver = $tag.TrimStart("v")
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "ver=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Release tag: $tag"
          Write-Host "Version: $ver"

      - name: Build Portable Zip & Setup Installer
        shell: pwsh
        env:
          VERSION: ${{ steps.meta.outputs.ver }}
        run: |
          .\scripts\build_installer.ps1 -Configuration Release -Runtime win-x64 -Version $env:VERSION

      - name: Prepare Winget Manifests
        shell: pwsh
        env:
          VERSION: ${{ steps.meta.outputs.ver }}
        run: |
          $setupExe = "dist\release\DeskVerve-Setup-$($env:VERSION)-x64.exe"
          .\tools\prepare_winget_release.ps1 -ExePath $setupExe -Version $env:VERSION -AssetName "DeskVerve-Setup-$($env:VERSION)-x64.exe"

      - name: Upload Winget Manifests Artifact
        uses: actions/upload-artifact@v4
        with:
          name: winget-manifests
          path: manifests/q/QuantumStep/QuantumUpdater/

      - name: Upload Release Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: DeskVerve ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          body: |
            ## Install DeskVerve
            - **Installer (recommended)**: Download `DeskVerve-Setup-${{ steps.meta.outputs.ver }}-x64.exe`, run and approve elevation.
            - **Portable**: Download `DeskVerve-Windows.zip`, extract all files, and run `DeskVerve.exe`.

            ### Windows Package Manager (winget)
            ```cmd
            winget install QuantumStep.QuantumUpdater
            ```
          files: |
            dist/release/DeskVerve-Windows.zip
            dist/release/DeskVerve-Windows.zip.sha256
            dist/release/DeskVerve-Setup-*-x64.exe
            dist/release/DeskVerve-Setup-*-x64.exe.sha256
          fail_on_unmatched_files: true
