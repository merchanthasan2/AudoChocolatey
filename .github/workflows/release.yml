name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v2.0.0)'
        required: false
        default: 'v2.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows app
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Resolve release tag
        id: meta
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag_name }}"
          } else {
            $tag = "${{ github.ref_name }}"
          }
          if (-not $tag) { $tag = "v2.0.0" }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Release tag: $tag"

      - name: Build Standalone PyInstaller Binary
        shell: pwsh
        run: |
          python build_exe.py QuantumUpdater
          New-Item -ItemType Directory -Force -Path py-artifacts
          # Portable EXE — AppUpdater + winget (QuantumStep.QuantumUpdater) use this asset.
          Copy-Item -Path "dist\QuantumUpdater\QuantumUpdater.exe" -Destination "py-artifacts\QuantumUpdater.exe"

      - name: Prepare winget manifests
        shell: pwsh
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          $ver = $tag.TrimStart("v")
          .\tools\prepare_winget_release.ps1 -ExePath "py-artifacts\QuantumUpdater.exe" -Version $ver
          New-Item -ItemType Directory -Force -Path winget-artifacts | Out-Null
          Copy-Item -Path "manifests\w\QuantumStep\QuantumUpdater\$ver\*" -Destination "winget-artifacts\" -Force
          Get-ChildItem winget-artifacts | Format-Table Name, Length

      - name: Upload PyInstaller Binary to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Quantum Updater ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          body: |
            ## Install
            After this package is accepted into the Windows Package Manager community repo:
            ```
            winget install QuantumStep.QuantumUpdater
            ```
            Direct download: `QuantumUpdater.exe` on this release.
            Winget YAML for submission is attached as release assets (`QuantumStep.QuantumUpdater.*.yaml`).
          files: |
            py-artifacts/QuantumUpdater.exe
            winget-artifacts/*
          fail_on_unmatched_files: true
