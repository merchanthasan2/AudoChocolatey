[package]
name = "quantum_updater"
version = "3.0.0-alpha.1"
description = "Quantum Updater - Windows software discovery and updates by Quantum Step"
authors = ["Quantum Step <contact@quantumstep.in>"]
edition = "2021"

[lib]
name = "quantum_updater_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Registry", "Win32_System_Com", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_Environment", "Win32_System_RemoteDesktop", "Win32_Security_Authentication_Identity", "Win32_Security_Authorization", "Win32_System_Power", "Win32_System_SystemInformation", "Win32_System_Restore"] }
tokio = { version = "1", features = ["process", "time", "rt", "macros", "sync"] }
async-trait = "0.1"
regex = "1"
unicode-width = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "http2", "system-proxy", "query"] }
quick-xml = "0.42"
winreg = "0.56"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico", "webp", "bmp", "gif"] }
resvg = { version = "0.48", default-features = false }
sha2 = "0.10"
url = "2"
ts-rs = { version = "12", features = ["no-serde-warnings"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
windows = { version = "0.62", features = ["Foundation", "Data_Xml_Dom", "Networking_Connectivity", "UI_Notifications", "Win32_System_Com", "Win32_System_TaskScheduler", "Win32_System_Variant", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"
