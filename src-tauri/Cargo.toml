[package]
name = "quantum_updater"
version = "3.0.0-alpha.1"
description = "Quantum Updater - Windows software discovery and updates by Quantum Step"
authors = ["Quantum Step <contact@quantumstep.in>"]
edition = "2021"

[lib]
name = "quantum_updater_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_Shell"] }
tokio = { version = "1", features = ["process", "time", "rt", "macros", "sync"] }
async-trait = "0.1"
regex = "1"
unicode-width = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "http2", "system-proxy", "query"] }
quick-xml = "0.42"
ts-rs = "12"

[dev-dependencies]
tempfile = "3"
